name: Secret Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  secrets:
    name: Detect Secrets & Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check git diff for secrets
        id: check-diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude)tests/" ":(exclude).github/workflows/" || git diff HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude)tests/" ":(exclude).github/workflows/")
          else
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              DIFF=$(git diff HEAD~1 HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude)tests/" ":(exclude).github/workflows/")
            else
              DIFF=$(git show HEAD -- . ":(exclude)hooks/" ":(exclude)scripts/" ":(exclude)tests/" ":(exclude).github/workflows/")
            fi
          fi

          P1="BEGIN RSA"
          P2="PRIVATE KEY"
          P3="BEGIN OPENSSH"
          REGEX_PAT="(${P1} ${P2}|${P3} ${P2}|GITHUB_TOKEN\s*=\s*['\"]?[A-Za-z0-9_]{10,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|AKIA[0-9A-Z]{16}|aws_secret_access_key|stripe_secret)"
          if echo "$DIFF" | grep -qE "$REGEX_PAT"; then
            echo "found_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "found_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR if secrets found
        if: github.event_name == 'pull_request' && steps.check-diff.outputs.found_secrets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Security Alert: Potential secrets detected in diff. Please remove credentials and rewrite git history with git filter-repo.'
            })

      - name: Fail if secrets detected
        if: steps.check-diff.outputs.found_secrets == 'true'
        run: exit 1
